server {
    listen 3000;
    listen 3100;
    server_name authserver-ui localhost;

    root /usr/share/nginx/html;

    location /ui/ {
        try_files $uri $uri/ /ui/index.html;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}